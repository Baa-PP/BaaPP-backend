spring:
  application:
    name: oviapp-backend
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/oviapp}
    username: ${RDS_USERNAME:postgres}
    password: ${RDS_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:5000}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  s3:
    bucket: ${S3_MEDIA_BUCKET:agrotech-oviapp-media}
    region: ${AWS_REGION:us-east-2}
    put-ttl-seconds: ${S3_PUT_TTL_SECONDS:300}
    get-ttl-seconds: ${S3_GET_TTL_SECONDS:300}
    max-size-bytes: ${S3_MAX_SIZE_BYTES:10485760}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:2592000}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  notifications:
    weaning-alerts:
      enabled: ${WEANING_ALERTS_ENABLED:false}

